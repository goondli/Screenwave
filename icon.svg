<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1726"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4dd9ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4dd9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- three screens -->
  <rect x="14" y="78" width="34" height="22" rx="3" fill="none" stroke="#4dd9ff" stroke-opacity="0.45" stroke-width="2.5"/>
  <rect x="52" y="70" width="24" height="38" rx="3" fill="none" stroke="#4dd9ff" stroke-opacity="0.45" stroke-width="2.5"/>
  <rect x="80" y="64" width="24" height="38" rx="3" fill="none" stroke="#4dd9ff" stroke-opacity="0.45" stroke-width="2.5"/>
  <!-- the wave crossing them -->
  <path d="M14 92 C 30 80, 42 100, 58 88 S 86 76, 104 84" fill="none" stroke="#a885ff" stroke-width="4" stroke-linecap="round"/>
  <!-- robot head -->
  <circle cx="64" cy="40" r="30" fill="url(#glow)"/>
  <line x1="64" y1="14" x2="64" y2="22" stroke="#4dd9ff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="12" r="4" fill="#ffcc4d"/>
  <rect x="44" y="22" width="40" height="32" rx="8" fill="#0d2233" stroke="#4dd9ff" stroke-width="3"/>
  <circle cx="56" cy="37" r="5" fill="#6bff9e"/>
  <circle cx="72" cy="37" r="5" fill="#6bff9e"/>
  <rect x="55" y="46" width="18" height="3" rx="1.5" fill="#4dd9ff"/>
</svg>
